name = "leetcode-tracker-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://leetcode-tracker-ui.leetcode-tracker-sahil.workers.dev"

